<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Henry — Full-Stack Software Developer</title>
  <desc id="desc">An editorial black and ivory banner. Large typography introduces Henry, a full-stack software developer in Pretoria, South Africa. Abstract diagonal strips move gently beside the name.</desc>
  <defs>
    <clipPath id="art"><rect x="856" y="96" width="296" height="216"/></clipPath>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .mono { font-family: 'Courier New', monospace; }
      .strip { animation: shift 10s cubic-bezier(.45,0,.55,1) infinite; }
      .second { animation-delay: -2s; }
      .third { animation-delay: -4s; }
      @keyframes shift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(18px,-18px); } }
      @media (prefers-reduced-motion: reduce) { .strip { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="420" fill="#f3f0e8"/>
  <g fill="#191919">
    <text x="48" y="43" class="mono" font-size="14" letter-spacing="1.2">HENRYG-CODE / SOFTWARE DEVELOPER</text>
    <text x="1152" y="43" text-anchor="end" class="mono" font-size="13">PRETORIA, SOUTH AFRICA</text>
  </g>
  <path d="M48 65h1104" stroke="#191919" stroke-width="1"/>
  <text x="40" y="207" fill="#191919" font-size="142" font-weight="900" letter-spacing="-10">HENRY.</text>
  <text x="48" y="258" fill="#191919" font-size="28" font-weight="600" letter-spacing="-.5">Full-Stack Software Developer</text>
  <text x="48" y="302" fill="#56544f" font-size="21">Thoughtful design. Practical software.</text>
  <rect x="856" y="96" width="296" height="216" fill="#191919"/>
  <g clip-path="url(#art)" fill="#f3f0e8">
    <path class="strip" d="m814 294 206-206h36L850 294z"/>
    <path class="strip second" d="m879 312 224-224h36L915 312z"/>
    <path class="strip third" d="m962 312 224-224h36L998 312z"/>
  </g>
  <text x="856" y="337" fill="#56544f" class="mono" font-size="12" letter-spacing="1.2">DESIGN &#215; DEVELOPMENT</text>
  <rect y="366" width="1200" height="54" fill="#191919"/>
  <text x="48" y="399" fill="#f3f0e8" class="mono" font-size="14" letter-spacing="1.3">WEBSITES / APPLICATIONS / BUSINESS SYSTEMS</text>
  <path d="M1106 393h44m-10-10 10 10-10 10" stroke="#f3f0e8" stroke-width="2" fill="none"/>
