<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Henry — Full-Stack Software Developer</title>
  <desc id="desc">Compact black and ivory header with bold typography and three continuously moving diagonal stripes.</desc>
  <defs>
    <clipPath id="art"><rect x="856" y="96" width="296" height="216"/></clipPath>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .mono { font-family: 'Courier New', monospace; }
      .strip { animation: shift 6s cubic-bezier(.45,0,.55,1) infinite; }
      .second { animation-delay: -2s; }
      .third { animation-delay: -4s; }
      @keyframes shift { 0%,100% { transform: translate(-10px,0); } 50% { transform: translate(18px,0); } }
      @media (prefers-reduced-motion: reduce) { .strip { animation: none; } }
    </style>
  </defs>
  <rect width="720" height="420" fill="#f3f0e8"/>
  <text x="32" y="42" class="mono" fill="#191919" font-size="17" letter-spacing="1">HENRYG-CODE / SOUTH AFRICA</text>
  <path d="M32 65h656" stroke="#191919"/>
  <text x="26" y="194" fill="#191919" font-size="108" font-weight="900" letter-spacing="-7">HENRY.</text>
  <text x="32" y="249" fill="#191919" font-size="30" font-weight="600" letter-spacing="-.5">Full-Stack Software Developer</text>
  <text x="32" y="299" fill="#56544f" font-size="28">Thoughtful design. Practical software.</text>
  <svg x="496" y="100" width="192" height="140" viewBox="856 96 296 216">
  <rect x="856" y="96" width="296" height="216" fill="#191919"/>
  <g clip-path="url(#art)" fill="#f3f0e8">
    <path class="strip" d="m814 294 206-206h36L850 294z"/>
    <path class="strip second" d="m879 312 224-224h36L915 312z"/>
    <path class="strip third" d="m962 312 224-224h36L998 312z"/>
  </g>

  </svg>
  <rect y="366" width="720" height="54" fill="#191919"/>
  <text x="32" y="399" class="mono" fill="#f3f0e8" font-size="19" letter-spacing=".7">WEBSITES / APPS / SYSTEMS</text>
  <path d="M644 393h44m-10-10 10 10-10 10" stroke="#f3f0e8" stroke-width="2" fill="none"/>
</svg>
